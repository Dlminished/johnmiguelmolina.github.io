<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0076d6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Workday-inspired icon -->
  <g transform="translate(5, 5)">
    <!-- Outer circle -->
    <circle cx="20" cy="20" r="18" fill="none" stroke="url(#logoGradient)" stroke-width="3"/>
    <!-- Inner design - abstract "W" shape -->
    <path d="M 12 28 L 15 15 L 20 22 L 25 15 L 28 28" fill="none" stroke="url(#logoGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Text -->
  <text x="50" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1a1a1a">
    Workday
  </text>
  <text x="135" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="300" fill="#ff6b35">
    Consultant
  </text>
</svg>

